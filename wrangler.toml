# Cloudflare Workers configuration (opt-in)
#
# Velocity's forms use Astro Actions, which need a server runtime. To deploy on
# Cloudflare, install the adapter and Wrangler first:
#
#   pnpm add @astrojs/cloudflare
#   pnpm add -D wrangler
#
# Cloudflare's own build picks the adapter by itself (CF_PAGES / WORKERS_CI).
# From your computer:
#
#   DEPLOY_TARGET=cloudflare pnpm build
#   pnpm wrangler deploy
#
# The build writes the Worker's entrypoint and its own Wrangler config from this
# file, so only the name and the settings below are yours to change. The
# [assets] block serves the prerendered site.

name = "velocity"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist/client"
not_found_handling = "404-page"
