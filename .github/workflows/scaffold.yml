# Velocity repository only. Removed from projects created by create-velocity-astro
# (listed in velocity-manifest.json → scaffold.cleanup).
name: Scaffold contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New projects have no lockfile, so a dependency's release can break them with no
  # change here. Checks that every day, not only when this repo changes.
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: scaffold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds every project shape create-velocity-astro can produce
  # ({demo, minimal} × {en, i18n} × {all components, none}) and runs the E2E
  # suite inside each full-component project, so a change that breaks a
  # variant fails here, not in a user's terminal.
  matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Component registry
        run: pnpm check:registry
      - run: pnpm exec playwright install --with-deps chromium
      - name: Scaffold, check, build and test every variant
        run: pnpm test:scaffold --e2e --out=${{ runner.temp }}/velocity-matrix

  # Installs the way a new project does: no lockfile, today's dependencies.
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Scaffold and check with no lockfile
        run: node scripts/scaffold-matrix.mjs --fresh --only=min-en-all --out=${{ runner.temp }}/velocity-fresh
