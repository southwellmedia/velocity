name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # Node adapter build — the same server the E2E suite runs against
      - name: Build
        run: pnpm build
        env:
          DEPLOY_TARGET: node
          SITE_URL: ${{ secrets.SITE_URL }}

      # Raw translation keys, CSP problems, broken links (see .agents/velocity.md)
      - name: Agent-ready check
        run: pnpm check:agent

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E + accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds for each serverless host and runs its server function: a form
  # submission must reach a mock endpoint, and failures must surface as errors
  # (scripts/smoke-adapter.mjs). The Node adapter is covered by the E2E job.
  # Remove the hosts you don't deploy to.
  adapters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [vercel, netlify, cloudflare]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cloudflare's adapter is opt-in (it pulls in workerd), so add it here
      - name: Install the Cloudflare adapter
        if: matrix.target == 'cloudflare'
        run: pnpm add @astrojs/cloudflare

      - name: Build
        run: pnpm build
        env:
          DEPLOY_TARGET: ${{ matrix.target }}

      - name: Smoke test the ${{ matrix.target }} build
        run: node scripts/smoke-adapter.mjs ${{ matrix.target }}

  # Deployment is handled by your host's Git integration (Vercel, Netlify,
  # Cloudflare). The adapter is auto-detected there — no workflow needed.
  # To deploy from CI instead, add a job here that runs after `validate`.
